<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café Pepita Admin Portal</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Connect JavaScript -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- LOGIN PAGE -->
    <section id="login">
      <div class="loginbox">
        <div class="login-logo-wrap"><img class="login-logo" src="cafe-pepita-logo.png" alt="Café Pepita logo" /></div>
        <div class="brand">CAFÉ PEPITA</div>
        <p class="sub">Admin &amp; Staff Portal</p>

        <h1>Log in</h1>

        <form id="loginForm">
          <label>
            Username
            <input
              id="user"
              type="text"
              name="username"
              placeholder="Enter username"
              autocomplete="username"
              required
            />
          </label>

          <label>
            Password
            <input
              id="pass"
              type="password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            />
          </label>

          <button class="primary" type="submit">Log in</button>

          <div id="err" class="sub" role="alert"></div>
        </form>

        <p class="sub" style="font-size: 12px; margin-top: 18px; text-align:center">
          Need an account?
          <a href="register.php" style="color:#3b201a; font-weight:600">Create an account</a>
        </p>
      </div>
    </section>

    <!-- MAIN APPLICATION -->
    <div id="app" class="app hidden">
      <!-- SIDEBAR -->
      <aside>
        <div class="brand">
          <img class="sidebar-logo" src="cafe-pepita-logo.png" alt="Café Pepita logo" />
          <div class="sidebar-brand-text">
            <strong>CAFÉ PEPITA</strong>
            <small>Pepi-Tap Admin</small>
          </div>
        </div>

        <nav class="side-nav" id="sideNav">
          <!-- Navigation generated by JavaScript -->
        </nav>

        <div class="side-bottom">
          <button class="outline" id="logout">Log out</button>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main>
        <!-- TOP NAVIGATION -->
        <header class="topbar">
          <div class="top-title" id="topTitle">
            Admin Panel
            <span>· Café Pepita</span>
          </div>

          <nav class="tabs" id="tabs">
            <!-- Navigation tabs generated by JavaScript -->
          </nav>
        </header>

        <!-- DYNAMIC PAGE CONTENT -->
        <section class="content" id="content">
          <!-- Dashboard and modules generated by JavaScript -->
        </section>
      </main>
    </div>
  </body>
</html>
